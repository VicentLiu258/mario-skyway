<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="https://www.youtube.com/game_api/v1"></script>
    <meta name="application-version" content="1.0.0">

    <title>Cloudpost Dash</title>

    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="full-screen" content="yes"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>

    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>

    <link rel="stylesheet" type="text/css" href="./style.css"/>
    <link rel="icon" href="favicon.ico"/>
  </head>
  <body>


    <div id="boot-splash" role="status" style="position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#f6f0df;color:#275d59;font:700 20px system-ui;text-align:center"><div><div style="font-size:48px;margin-bottom:16px">◇</div>CLOUDPOST DASH<small style="display:block;margin-top:18px;font-size:13px;font-weight:400">Loading the courier crew…</small></div></div>
    <script>
      if (window.ytgame && window.ytgame.IN_PLAYABLES_ENV) {
        window.ytgame.game.firstFrameReady();
        window.__cloudpostFirstFrameReady = true;
      }
    </script>
    <div id="GameDiv" cc_exact_fit_screen="true" style="width: 1280px; height: 960px;">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" width="1280" height="960" tabindex="99"></canvas>
      </div>
    </div>
    <!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>    


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.js').catch(function(err) { console.error(err); })
</script>
  </body>
</html>
